version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: planova-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: planova
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planova"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - planova-network

  redis:
    image: redis:7-alpine
    container_name: planova-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - planova-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  planova-network:
    driver: bridge
