services:
  # 1. NestJS API Backend Service (Free Tier, no credit card required)
  - type: web
    name: planova-api
    env: node
    plan: free
    region: oregon
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter api... build
    startCommand: pnpm --filter api start:prod
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_JOqv9a1kZEBo@ep-young-poetry-av52sebw-pooler.c-11.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: JWT_SECRET
        value: super_secret_access_token_key_change_me
      - key: JWT_REFRESH_SECRET
        value: super_secret_refresh_token_key_change_me
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
